<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e8ebf4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121931" media="(prefers-color-scheme: dark)">
  <title>Mistr Impostor</title>
  <meta name="description" content="Párty hra pro partu kamarádů. Všichni znají tajemství – až na jednoho.">

  <!-- PWA. Všechny cesty jsou relativní, aby appka fungovala i na podcestě (GitHub Pages). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- iOS: spuštění na celou obrazovku jako appka -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Impostor">

  <link rel="preload" href="fonts/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/main.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="spot spot-1"></span>
    <span class="spot spot-2"></span>
  </div>
  <header class="app-bar">
    <button class="icon-btn" id="mute" type="button" aria-label="Ztlumit zvuky" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-sound-on">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
        <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-sound-off">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
        <path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </header>
  <main id="app">
    <!-- Úvod -->
    <section class="screen" data-screen="home" hidden>
      <div class="fan" aria-hidden="true">
        <span class="fan-card fan-card--words"></span>
        <span class="fan-card fan-card--questions"></span>
        <span class="fan-card fan-card--impostor"><svg class="fan-mask" viewBox="0 0 64 38"><path fill="currentColor" fill-rule="evenodd" d="M4 9C14 2 50 2 60 9c0 15-6 25-17 25-6 0-8-6-11-6s-5 6-11 6C10 34 4 24 4 9zm11 9.5c0 3 3 5 6.5 5s6.5-2 6.5-5-3-4.5-6.5-4.5S15 15.5 15 18.5zm21 0c0 3 3 5 6.5 5s6.5-2 6.5-5-3-4.5-6.5-4.5S36 15.5 36 18.5z"/></svg></span>
      </div>
      <header class="home-title">
        <h1 class="logo"><span>Mistr</span> <span>Impostor</span></h1>
        <p class="tagline">Všichni znají tajemství.<br>Až na jednoho.</p>
      </header>
      <div class="home-actions">
        <button class="btn btn-primary btn-lg" data-go="local-setup">Hrát na jednom telefonu</button>
        <!-- Online režim je hotový až v milníku 2; do té doby je vstup schovaný. -->
        <div class="btn-pair" hidden>
          <button class="btn" data-go="online-create">Založit místnost</button>
          <button class="btn" data-go="online-join">Připojit se</button>
        </div>
      </div>
    </section>

    <!-- Lokální režim -->
    <section class="screen" data-screen="local-setup" hidden>
      <header class="screen-header"><button class="btn-back" data-go="home" data-dir="back" aria-label="Zpět">‹</button><h2>Nastavení</h2></header>
      <div class="stack" data-slot="content"></div>
    </section>

    <section class="screen" data-screen="local-role" hidden>
      <div class="stack center" data-slot="content"></div>
    </section>

    <section class="screen" data-screen="local-round" hidden>
      <header class="screen-header"><h2>Hrajte!</h2></header>
      <div class="stack" data-slot="content"></div>
    </section>

    <section class="screen" data-screen="local-countdown" hidden>
      <div class="stack center" data-slot="content"></div>
    </section>

    <section class="screen" data-screen="local-result" hidden>
      <header class="screen-header"><h2>Výsledek</h2></header>
      <div class="stack" data-slot="content"></div>
    </section>

    <!-- Online režim -->
    <section class="screen" data-screen="online-create" hidden>
      <header class="screen-header"><button class="btn-back" data-go="home" data-dir="back" aria-label="Zpět">‹</button><h2>Nová místnost</h2></header>
      <div class="stack" data-slot="content"><p class="muted">Připravujeme…</p></div>
    </section>

    <section class="screen" data-screen="online-join" hidden>
      <header class="screen-header"><button class="btn-back" data-go="home" data-dir="back" aria-label="Zpět">‹</button><h2>Připojit se</h2></header>
      <div class="stack" data-slot="content"><p class="muted">Připravujeme…</p></div>
    </section>

    <section class="screen" data-screen="online-lobby" hidden>
      <header class="screen-header"><h2>Lobby</h2></header>
      <div class="stack" data-slot="content"></div>
    </section>

    <section class="screen" data-screen="online-role" hidden>
      <div class="stack center" data-slot="content"></div>
    </section>
  </main>
</body>
</html>
